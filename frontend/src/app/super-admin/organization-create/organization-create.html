<main class="page-shell">
  <section class="form-container">
    <div class="brand-mark" aria-hidden="true">⚖</div>
  <h1>لوحة تأسيس المحاكم المركزية</h1>
  <p class="subtitle">منصة ناجز الإدارية</p>
  <div class="access-note">
    <span aria-hidden="true">●</span>
    خاص بآدمن ناجز الرئيسي فقط
  </div>

  <!-- ربط الفورم بحدث ngSubmit وإرسال نموذج الاستمارة بالكامل -->
  <form #courtForm="ngForm" (ngSubmit)="onSubmit(courtForm)">
    
    <div class="form-group">
      <label>اسم المحكمة الرسمي:</label>
      <input 
      type="text" name="courtName" 
      [(ngModel)]="datacourt.name"  
        
      required placeholder="مثال: محكمة البداية المدنية بدمشق">
    </div>

    <div class="form-group">
      <label>نوع التصنيف القضائي:</label>
      <input 
      type="text" 
      name="courtType" 
      [(ngModel)]="datacourt.type"
      required 
      placeholder="مثال: مدني / صلح / استئناف">
    </div>

    <div class="form-group">
      <label>العنوان الجغرافي الكامل:</label>
      <input 
      type="text" 
      name="address" 
      [(ngModel)]="datacourt.address" 
      required 
      placeholder="مثال: دمشق - قصر العدل بالمرجة">
    </div>

    <div class="form-group">
      <label>رقم الهاتف العام:</label>
      <input 
      type="text" 
      name="phoneNumber" 
      [(ngModel)]="datacourt.phone"
      required 
      placeholder="مثال: 011-2211445">
    </div>

    <div class="form-group">
      <label>كود الربط البرمجي السري (Code):</label>
      <input 
      type="text" 
      name="code" 
      [(ngModel)]="datacourt.code"
      (ngModelChange)="functiommmm($event)"
      required 
      minlength="3" 
      placeholder="مثال: marya">
    </div>

    <!-- الزر يقفل تلقائياً إذا كانت هناك خانة فارغة بفضل شروط الـ HTML العادية -->
    <button 
      type="submit" 
      [disabled]="courtForm.invalid">
      <span>تأسيس المحكمة وإطلاق النظام</span>
      <span class="button-arrow" aria-hidden="true">←</span>
    </button>

  </form>
  </section>

</main>
   <button type="button" (click)="magicFill()" style="background-color: #3498db; margin-bottom: 20px;">
      ✨ اضغط هنا للتعبئة التلقائية من الـ TS
    </button>

<h1>الاسم الملتقط الآن في الـ TS هو: {{ datacourt.name }}</h1>
<h1>الاسم الملتقط الآن في الـ TS هو: {{ datacourt.phone }}</h1>
 <h1>الاسم الملتقط الآن في الـ TS هو: {{ datacourt.code }}</h1>
